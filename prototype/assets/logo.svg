<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" width="132" height="132" role="img" aria-label="智能求职助手">
  <title>智能求职助手 · 主图标</title>

  <!--
    设计说明
    · 头部为超大圆角方形，与「简历卡片」同一种形状语言 —— 机器人本身就是一份站着的小简历。
    · 头身比约 2:1，Kawaii 风格的标准比例。
    · 五官以 32px 渲染为基准调校：眼睛半径 5.4、微笑描边 3.2，
      保证缩小后仍是实心像素而非半透明边缘（见设计文档的尺寸验证记录）。
    · 薄荷绿只出现在两处星与卡片的勾选上，保持点缀色的分量。
  -->
  <defs>
    <linearGradient id="cp-head" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#8FCBF7"/>
      <stop offset="1" stop-color="#78BDF5"/>
    </linearGradient>
    <linearGradient id="cp-body" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#B7ABF9"/>
      <stop offset="1" stop-color="#A99AF7"/>
    </linearGradient>
  </defs>

  <!-- 整体微调，使图形在 132 画布中四周留白均等 -->
  <g transform="translate(-1.05 -2.35)">

    <!-- 头部左侧的小星（与天线星呼应，一大一小） -->
    <path d="M27 49.5Q28.6 55.4 34.5 57Q28.6 58.6 27 64.5Q25.4 58.6 19.5 57Q25.4 55.4 27 49.5Z" fill="#9DE4CC"/>

    <!-- 天线顶端的星 -->
    <path d="M66 10.5Q67.8 19.2 76.5 21Q67.8 22.8 66 31.5Q64.2 22.8 55.5 21Q64.2 19.2 66 10.5Z" fill="#9DE4CC"/>

    <!-- 天线杆 -->
    <line x1="66" y1="31" x2="66" y2="45" stroke="#A99AF7" stroke-width="3.4" stroke-linecap="round"/>

    <!-- 身体（先绘制，上沿随后被头部覆盖，形成肩部轮廓） -->
    <rect x="45" y="88" width="42" height="26" rx="13" fill="url(#cp-body)"/>

    <!-- 头部 -->
    <rect x="36" y="41" width="60" height="54" rx="19" fill="url(#cp-head)"/>

    <!-- 面部 -->
    <ellipse cx="66" cy="71" rx="23" ry="16" fill="#FFF9F0"/>

    <!-- 眼睛与高光 -->
    <circle cx="57" cy="68" r="5.4" fill="#34415E"/>
    <circle cx="75" cy="68" r="5.4" fill="#34415E"/>
    <circle cx="58.8" cy="66.2" r="1.7" fill="#FFF9F0"/>
    <circle cx="76.8" cy="66.2" r="1.7" fill="#FFF9F0"/>

    <!-- 微笑 -->
    <path d="M60 77Q66 82.8 72 77" fill="none" stroke="#34415E" stroke-width="3.2" stroke-linecap="round"/>

    <!-- 右手斜持的简历卡片 -->
    <g transform="rotate(-10 98 109)">
      <rect x="84" y="94" width="28" height="30" rx="4.5" fill="#FFF9F0"/>
      <line x1="90" y1="103" x2="106" y2="103" stroke="#CBD8EA" stroke-width="2.1" stroke-linecap="round"/>
      <line x1="90" y1="110" x2="102" y2="110" stroke="#CBD8EA" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M90 117L93 120L100 112" fill="none" stroke="#9DE4CC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

  </g>
</svg>
