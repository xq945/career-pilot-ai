<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人中心 · 智能求职辅助平台</title>
<!--
  页面：个人中心
  路由：/profile
  接口：GET    /api/user/profile   读取当前用户资料
        PUT    /api/user/profile   更新昵称（仅昵称可改，必填且 ≤ 50 字符）
        POST   /api/user/avatar    上传头像（JPG/PNG、≤ 2 MB，上传即替换并删除旧文件）
        DELETE /api/user/avatar    移除头像（幂等）
        POST   /api/auth/logout    退出登录（服务端不使 Token 失效，由前端清除 localStorage 完成）
  说明：用户名与邮箱为唯一标识，第一版不提供修改入口；
        第一版未提供「修改密码」接口，因此本页不设计该功能。
        头像交互规格见《前端原型设计》§5.13（V1.5）。
        基本资料卡片默认只读展示，点右上角修改图标进入编辑态：昵称可输入、头像操作按钮与
        「取消 / 保存修改」出现。头像操作在编辑态仍即时生效（取消不撤销头像，仅昵称可撤销）。
        页面描述、字段提示等辅助小字不再展示（V1.5）。
-->
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/prototype.css">
<style>
  /* ==== 页内样式：基本资料「展示态 ↔ 编辑态」（原型演示专用；Vue 实现用组件状态） ==== */

  /* 卡片头右上角的修改图标按钮 */
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: #fff;
    color: var(--ink-500);
    cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  .icon-btn:hover { color: var(--brand-600); border-color: var(--brand-200); background: var(--brand-50); }

  /* 字段的只读展示值（与输入框同高，保证两种状态间不跳动） */
  .field__static { display: flex; align-items: center; height: 36px; font-size: 13px; color: var(--ink-900); }

  /* 显隐切换：展示态隐藏编辑控件与卡片脚；编辑态隐藏只读值 */
  #basic-card .edit-only { display: none; }
  #basic-card .card__foot { display: none; }
  #basic-card.is-editing .edit-only { display: block; }
  #basic-card.is-editing .card__foot { display: flex; }
  #basic-card.is-editing .field__static { display: none; }
</style>
</head>
<body data-page="profile" data-crumb="账号 / <b>个人中心</b>">
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>

    <div class="content">
      <div class="content__inner" style="max-width:820px">

        <div class="page-head">
          <div class="page-head__text"><h1>个人中心</h1></div>
        </div>

        <!-- ===== 基本资料（展示态 / 编辑态） ===== -->
        <div class="card" id="basic-card">
          <div class="card__head">
            <h2>基本资料</h2>
            <button class="icon-btn" type="button" data-edit-toggle="#basic-card" title="修改资料" aria-label="修改资料">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 5.5l3 3"/>
              </svg>
            </button>
          </div>
          <div class="card__body">

            <div class="row mb-20" style="gap:18px">
              <div style="width:64px;height:64px;border-radius:50%;background:var(--brand-600);color:#fff;
                          display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 64px">求</div>
              <!-- 头像操作仅在编辑态出现；上传/移除仍即时生效 -->
              <div class="edit-only">
                <div class="row mb-8">
                  <button class="btn btn--sm">更换头像</button>
                  <button class="btn btn--sm btn--ghost">移除</button>
                </div>
                <div class="small muted">支持 JPG / PNG，建议 200×200 像素以内；不超过 2 MB</div>
              </div>
            </div>

            <div class="grid grid--2">
              <div class="field">
                <label class="field__label">昵称</label>
                <div class="field__static">求职者</div>
                <input class="input edit-only" type="text" value="求职者" maxlength="50">
              </div>

              <div class="field">
                <label class="field__label">用户名</label>
                <div class="field__static">student01</div>
                <input class="input edit-only" type="text" value="student01" disabled style="background:#f8fafc;color:var(--ink-400)">
              </div>

              <div class="field">
                <label class="field__label">邮箱</label>
                <div class="field__static">student01@example.com</div>
                <input class="input edit-only" type="email" value="student01@example.com" disabled style="background:#f8fafc;color:var(--ink-400)">
              </div>

              <div class="field">
                <label class="field__label">用户 ID</label>
                <div class="field__static">1</div>
                <input class="input edit-only" type="text" value="1" disabled style="background:#f8fafc;color:var(--ink-400)">
              </div>
            </div>
          </div>
          <div class="card__foot">
            <span class="spacer"></span>
            <button class="btn">取消</button>
            <button class="btn btn--primary">保存修改</button>
          </div>
        </div>

        <!-- ===== 登录状态 ===== -->
        <div class="card">
          <div class="card__head"><h2>登录状态</h2></div>
          <div class="card__body">
            <div class="row">
              <div class="spacer">
                <div class="strong">当前设备已登录</div>
                <div class="small muted mt-8">Token 有效期 2 小时，过期后需重新登录</div>
                <!-- 本次登录时刻与已用时长：实现时分别取自 Token 签发时间与进入后的计时 -->
                <div class="small muted mt-8">本次登录：2026-10-10 10:30　·　已使用：23 分钟</div>
              </div>
              <button class="btn btn--danger">退出登录</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="assets/prototype.js"></script>
</body>
</html>
