# 测试专用配置：用内存库满足 DataSource 自动装配，避免测试依赖本机 MySQL
spring:
  datasource:
    url: jdbc:h2:mem:careerpilot;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  ai:
    deepseek:
      # 占位值：仅为让 DeepSeekChatAutoConfiguration 完成装配，
      # 测试不发起真实模型调用，因此无需真实密钥，也不应写入真实密钥。
      api-key: test-placeholder-key

app:
  jwt:
    # 测试专用密钥，长度满足 HS256 的 32 字节要求。
    # 仅供单元测试使用，与真实环境无关。
    secret: test-only-secret-key-do-not-use-in-production-0123456789
  file:
    # FileStorageProperties 在构造时创建存储根目录：不覆盖的话，
    # @SpringBootTest 会在真实用户主目录下创建 career-pilot-uploads。
    # 这里改到构建目录，随 mvn clean 一起清理。
    storage-root: target/test-uploads
