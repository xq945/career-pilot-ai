# 测试专用配置：用内存库满足 DataSource 自动装配，避免测试依赖本机 MySQL
spring:
  datasource:
    url: jdbc:h2:mem:careerpilot;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  ai:
    deepseek:
      # 占位值：仅为让 DeepSeekChatAutoConfiguration 完成装配，
      # 测试不发起真实模型调用，因此无需真实密钥，也不应写入真实密钥。
      api-key: test-placeholder-key

app:
  jwt:
    # 测试专用密钥，长度满足 HS256 的 32 字节要求。
    # 仅供单元测试使用，与真实环境无关。
    secret: test-only-secret-key-do-not-use-in-production-0123456789
  agent:
    # 同 app.match：本文件在测试 classpath 上优先于 src/main/resources/application.yml，
    # AgentProperties 是构造器绑定的 fail-fast 配置，不同步声明会导致上下文加载测试（与
    # Mockito 测试的 lambda 缓存）连带失败，故此处按主配置口径补齐。
    total-timeout-millis: 120000
    max-tool-calls: 5
    history-message-limit: 10
    history-char-limit: 6000
    catalog-limit: 20
  match:
    # 本文件在测试 classpath 上**优先于** src/main/resources/application.yml
    # （同名文件只加载一个），因此评分配置必须在测试侧同步声明，
    # 否则 MatchScoringProperties 构造校验会因权重为 0 而失败。
    rule-version: v1
    weights:
      required-skills: 45
      project-relevance: 25
      experience: 15
      education: 10
      preferred-skills: 5
  file:
    # FileStorageProperties 在构造时创建存储根目录：不覆盖的话，
    # @SpringBootTest 会在真实用户主目录下创建 career-pilot-uploads。
    # 这里改到构建目录，随 mvn clean 一起清理。
    storage-root: target/test-uploads
