server:
  port: 8080

spring:
  application:
    name: career-pilot-server

  # 本地开发配置（数据库密码、API Key 等）存放于 application-local.yml，
  # 该文件已被 .gitignore 忽略，不进入仓库。
  # 部署时以外部参数覆盖，例如 --spring.profiles.active=prod
  profiles:
    active: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/career_pilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  servlet:
    multipart:
      # 全局单文件上限 10 MB（《系统架构设计》6.1，为 M3 简历预留）；头像另有 2 MB 业务级限制
      max-file-size: 10MB
      # 略大于 max-file-size：multipart 边界与请求头同样计入请求体，
      # 两值相等时"恰好 10MB 的文件"会被误判超限
      max-request-size: 11MB

  ai:
    deepseek:
      base-url: https://api.deepseek.com
      chat:
        # 统一关闭思考模式（《Agent设计》7.2 的关键决策）：
        # 思考模式与 Tool Calling 组合存在强制协议约束，且会使 temperature 失效。
        # 属性路径注意：chat.thinking 是当前写法；chat.options.thinking 已废弃
        # （见配置元数据，其 deprecation.replacement 指向 chat.thinking）。
        thinking:
          type: disabled
        options:
          # 模型名必须显式配置，禁止依赖 Spring AI 默认值
          # （Spring AI 旧版默认值为已退役的 deepseek-chat，见《设计审查报告》P0-3）
          model: deepseek-flash
          # 结构化输出场景宜取低值（《Agent设计》7.1）
          temperature: 0.3

# 敏感配置约定（《系统架构设计》7、9 节）：
# 数据库密码、JWT 密钥、DeepSeek API Key 一律通过环境变量或 application-local.yml
# 注入，本文件不含任何真实凭据。

app:
  jwt:
    # Token 有效期，单位秒，缺省 2 小时（《API接口设计》2 节）
    # 签名密钥 app.jwt.secret 存放在 application-local.yml
    expiration-seconds: 7200
  cors:
    # 开发环境前端来源（《系统架构设计》7.2）；
    # 生产环境与 API 同源部署，届时不应再开放跨域
    allowed-origins: http://localhost:5173
  file:
    # 文件存储实现（《系统架构设计》7.1，M2 定死）：
    #   local = 本地磁盘（缺省；开发与答辩演示使用，不依赖公网）
    #   oss   = 阿里云 OSS（endpoint / bucket / AccessKey 配置见 application-local.yml）
    storage-type: ${FILE_STORAGE_TYPE:local}
    # local 实现的存储根目录，须位于项目运行目录之外；不存在时应用启动即创建
    storage-root: ${FILE_STORAGE_ROOT:${user.home}/career-pilot-uploads}
