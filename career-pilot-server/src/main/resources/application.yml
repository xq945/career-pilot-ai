server:
  port: 8080

spring:
  application:
    name: career-pilot-server

  # 本地开发配置（数据库密码、API Key 等）存放于 application-local.yml，
  # 该文件已被 .gitignore 忽略，不进入仓库。
  # 部署时以外部参数覆盖，例如 --spring.profiles.active=prod
  profiles:
    active: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/career_pilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  servlet:
    multipart:
      # 单文件上限 10 MB（《系统架构设计》6.1）；头像另有 2 MB 业务级限制。
      # 该检查在**流式读取中**触发：读满 10 MB 即中断，剩余数据不多，可优雅返回 413。
      max-file-size: 10MB
      # 请求体总上限刻意放宽到 50 MB（不是 11MB），原因见下方 tomcat 段：
      # max-request-size 是**基于 Content-Length 的读取前预检查**，一旦触发，
      # 请求体一个字节都没读就被拒绝，连接会被直接切断（浏览器只见网络错误）。
      # 放宽后，10 MB 以上的文件走流式路径，统一由 max-file-size 承接并返回 413。
      max-request-size: 50MB

  tomcat:
    # 请求体被拒时，Tomcat 需"吞掉"（swallow）剩余未读数据才能把 413 响应发完；
    # 超出 swallow 上限则直接断连。默认 2MB 在浏览器上传 10 MB 以上文件时表现为
    # "Failed to fetch"（curl 因已收到响应头看不出该问题，M2 曾据此误判为
    # "不构成问题"——见《问题记录 · 配置与启动》）。与 max-request-size 对齐取 50MB，
    # 保证 ≤50MB 的超限请求都能收到 413/41300 而非连接中断。
    max-swallow-size: 50MB

  ai:
    deepseek:
      base-url: https://api.deepseek.com
      chat:
        # 统一关闭思考模式（《Agent设计》7.2 的关键决策）：
        # 思考模式与 Tool Calling 组合存在强制协议约束，且会使 temperature 失效。
        # 属性路径注意：chat.thinking 是当前写法；chat.options.thinking 已废弃
        # （见配置元数据，其 deprecation.replacement 指向 chat.thinking）。
        thinking:
          type: disabled
        options:
          # 模型名必须显式配置，禁止依赖 Spring AI 默认值
          # （Spring AI 旧版默认值为已退役的 deepseek-chat，见《设计审查报告》P0-3）
          model: deepseek-flash
          # 结构化输出场景宜取低值（《Agent设计》7.1）
          temperature: 0.3
    # 【必须显式配置】Spring AI 的重试默认 max-attempts=10、退避 2000ms × 5 倍递增
    # （见 spring-ai-autoconfigure-retry 的配置元数据），一次读取超时会被重试到分钟级，
    # 与「单次调用读超时 60 秒 + 前端 120 秒」的约定直接冲突。
    # 《Agent设计》8 要求"只对可恢复错误有限重试（建议最多 2 次）"，故取 2 次尝试
    # （1 次初始 + 1 次重试）：最坏 60 + 0.5 + 60 ≈ 121 秒，与前端 120 秒基本对齐。
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 1
        max-interval: 1s
    chat:
      client:
        observations:
          # 提示词含简历原文，观测数据一律不记录内容（《系统架构设计》7 节第 7 条）
          log-prompt: false
          log-completion: false

  # Spring AI 2.0.1 没有自己的 timeout 属性（已核实其配置元数据）：它复用 Spring Boot
  # 自动装配的 RestClient.Builder，超时由下面两项注入（《Agent设计》8：连接 10 秒、读取 60 秒）。
  # 全项目仅 AI 一处出站 HTTP（Tika 为本地解析），全局生效安全。
  # 调小 read-timeout（如 1s）可作为 50200 的构造手段（《测试与验收方案》2.3）。
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 60s

# 敏感配置约定（《系统架构设计》7、9 节）：
# 数据库密码、JWT 密钥、DeepSeek API Key 一律通过环境变量或 application-local.yml
# 注入，本文件不含任何真实凭据。

app:
  jwt:
    # Token 有效期，单位秒，缺省 2 小时（《API接口设计》2 节）
    # 签名密钥 app.jwt.secret 存放在 application-local.yml
    expiration-seconds: 7200
  cors:
    # 开发环境前端来源（《系统架构设计》7.2）；
    # 生产环境与 API 同源部署，届时不应再开放跨域
    allowed-origins: http://localhost:5173
  file:
    # 文件存储实现（《系统架构设计》7.1，M2 定死）：
    #   local = 本地磁盘（缺省；开发与答辩演示使用，不依赖公网）
    #   oss   = 阿里云 OSS（endpoint / bucket / AccessKey 配置见 application-local.yml）
    storage-type: ${FILE_STORAGE_TYPE:local}
    # local 实现的存储根目录，须位于项目运行目录之外；不存在时应用启动即创建
    storage-root: ${FILE_STORAGE_ROOT:${user.home}/career-pilot-uploads}
